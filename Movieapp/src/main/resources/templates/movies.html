<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Movies</title>
</head>
<body>

<h2>All Movies</h2>

<a href="/add">Add New Movie</a> |
<a href="/search">Search</a>

<br><br>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Rating</th>
        <th>Genre</th>
        <th>Actions</th>
    </tr>

    <tr th:each="m : ${movies}">
        <td th:text="${m.id}"></td>
        <td th:text="${m.name}"></td>
        <td th:text="${m.rating}"></td>
        <td th:text="${m.genre}"></td>
        <td>
            <a th:href="@{/edit/{id}(id=${m.id})}">Edit</a> |
            <a th:href="@{/delete/{id}(id=${m.id})}">Delete</a>
        </td>
    </tr>
</table>

</body>
</html>
